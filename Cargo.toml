[package]
name = "hash-check"
version = "0.1.0"
edition = "2024"
description = "GUI file-integrity checker: detects file changes and bit rot by comparing hashes"
license = "GPL-3.0-only"
repository = "https://github.com/camilus123/hash-check"

[lib]
name = "hash_check"
path = "src/lib.rs"

[[bin]]
name = "hash-check"
path = "src/main.rs"

[dependencies]
blake3 = { version = "1.8.7", features = ["rayon"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = "0.37.0"
rfd = "0.18.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
sha2 = "0.11.1"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_128"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Hashing and SQLite stay optimised in debug builds, otherwise tests crawl.
[profile.dev.package."*"]
opt-level = 3
