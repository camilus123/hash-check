name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/hash-check.exe -Algorithm SHA256).Hash.ToLower()
          "$h  hash-check.exe" | Out-File -Encoding ascii target/release/hash-check.exe.sha256
          Get-Content target/release/hash-check.exe.sha256
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hash-check-windows-x64
          path: |
            target/release/hash-check.exe
            target/release/hash-check.exe.sha256
          if-no-files-found: error

  # When main carries a version in Cargo.toml that has no release yet, tag it
  # (vX.Y.Z) and publish the Windows executable built above.
  release:
    name: Tag and publish new version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version already exists; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          name: hash-check-windows-x64
          path: dist
      - name: Create tag and release
        if: steps.v.outputs.new == 'true'
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${{ steps.v.outputs.version }}" '
            /^## / { on = (index($0, "## " v " ") == 1) ; next }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release create "${{ steps.v.outputs.tag }}" dist/hash-check.exe dist/hash-check.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "hash-check ${{ steps.v.outputs.version }}" \
            --notes-file notes.md
