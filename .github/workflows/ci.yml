name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/hash-check.exe -Algorithm SHA256).Hash.ToLower()
          "$h  hash-check.exe" | Out-File -Encoding ascii target/release/hash-check.exe.sha256
          Get-Content target/release/hash-check.exe.sha256
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hash-check-windows-x64
          path: |
            target/release/hash-check.exe
            target/release/hash-check.exe.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hash-check-windows-x64
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/hash-check.exe dist/hash-check.exe.sha256 \
            --title "hash-check ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
